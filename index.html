        const stationConfig = {"JAK": {"tl": ["-3.9237287198122797", "104.39898771981228"], "br": ["-8.418959280187721", "108.89421828018772"], "name": "Tangerang"}, "YOG": {"tl": ["-5.484038019812279", "108.10668631981227"], "br": ["-9.979268580187721", "112.6019168801877"], "name": "Yogyakarta"}, "SBY": {"tl": ["-5.162649719812278", "110.51281671981229"], "br": ["-9.657880280187719", "115.00804728018772"], "name": "Surabaya"}, "DEN": {"tl": ["-6.491549719812279", "112.93123971981228"], "br": ["-10.98678028018772", "117.42647028018771"], "name": "Denpasar"}, "BTH": {"tl": ["3.3724162801877204", "101.86413971981229"], "br": ["-1.1228142801877208", "106.35937028018772"], "name": "Batam"}, "BAL": {"tl": ["0.9878822801877207", "114.64938471981229"], "br": ["-3.5073482801877205", "119.14461528018772"], "name": "Balikpapan"}, "MAK": {"tl": ["-2.81493071981227", "117.283405719812"], "br": ["-7.31016128018772", "121.778636280187"], "name": "Makassar"}, "MED": {"tl": ["5.787323280187721", "96.38955071981229"], "br": ["1.2920927198122794", "100.88478128018772"], "name": "Medan"}, "SIN": {"tl": ["3.5182160000000003", "101.8125000000000000"], "br": ["-0.8198160000000003", "106.1285000000000000"], "name": "Singapore"}};
        
        let map = L.map('map').setView([-6.2, 106.8], 8);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        let currentOverlay = null; // TRACK THE CURRENT IMAGE
        let currentStation = 'JAK';
        let isPlaying = false;
        let currentIndex = 0;
        let timer = null;

        const select = document.getElementById('stationSelect');
        for(let s in stationConfig) {
            let opt = document.createElement('option');
            opt.value = s;
            opt.text = stationConfig[s].name;
            select.add(opt);
        }

        function changeStation() {
            currentStation = select.value;
            currentIndex = radarData[currentStation] ? radarData[currentStation].length - 1 : 0;
            updateMap();
        }

        function updateMap() {
            let frames = radarData[currentStation];
            if(!frames || frames.length === 0) return;
            
            let frame = frames[currentIndex];
            let cfg = stationConfig[currentStation];

            // --- THE FIX: REMOVE OLD LAYER BEFORE ADDING NEW ONE ---
            if(currentOverlay) {
                map.removeLayer(currentOverlay);
            }

            let bounds = [cfg.tl, cfg.br];
            currentOverlay = L.imageOverlay(frame.url, bounds, {opacity: 0.8}).addTo(map);
            
            document.getElementById('timeDisplay').innerText = frame.time;
            document.getElementById('timeline').max = frames.length - 1;
            document.getElementById('timeline').value = currentIndex;
            
            // Optional: Auto-pan to new station location
            // map.flyTo([(parseFloat(cfg.tl[0]) + parseFloat(cfg.br[0]))/2, (parseFloat(cfg.tl[1]) + parseFloat(cfg.br[1]))/2], 8);
        }

        function togglePlay() {
            if(isPlaying) {
                clearInterval(timer);
                isPlaying = false;
            } else {
                isPlaying = true;
                timer = setInterval(() => {
                    if (!radarData[currentStation]) return;
                    currentIndex++;
                    if(currentIndex >= radarData[currentStation].length) currentIndex = 0;
                    updateMap();
                }, 500); 
            }
        }

        function scrub(val) {
            currentIndex = parseInt(val);
            updateMap();
        }

        // Start
        changeStation();
    </script>
