<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Archive</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: sans-serif; background: #1a1a1a; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        #map { flex: 1; width: 100%; }
        #controls { background: #222; padding: 10px; border-bottom: 1px solid #444; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
        select, button { background: #333; color: white; border: 1px solid #555; padding: 5px 10px; border-radius: 4px; }
        button:hover { background: #444; cursor: pointer; }
        .group { display: flex; flex-direction: column; gap: 2px; }
        label { font-size: 10px; color: #aaa; font-weight: bold; text-transform: uppercase; }
        #timestamp { font-family: monospace; font-size: 16px; color: #4ade80; font-weight: bold; min-width: 180px; }
        #stations { display: flex; gap: 10px; flex-wrap: wrap; }
        .station-toggle { font-size: 12px; display: flex; align-items: center; gap: 4px; }
        input[type="range"] { width: 200px; accent-color: #4ade80; }
        #loading-bar { height: 3px; background: transparent; width: 100%; position: absolute; top: 0; left: 0; z-index: 999; }
        #loading-fill { height: 100%; background: #4ade80; width: 0%; transition: width 0.2s; }
        .nav-link { margin-left: auto; font-size: 12px; color: #4ade80; text-decoration: none; border: 1px solid #4ade80; padding: 5px 10px; border-radius: 4px; }
        .nav-link:hover { background: #4ade80; color: #1a1a1a; }
    </style>
</head>
<body>
    <div id="loading-bar"><div id="loading-fill"></div></div>
    <div id="controls">
        <div class="group">
            <label>Month</label>
            <select id="month-select"></select>
        </div>
        <div class="group">
            <label>Day</label>
            <select id="day-select"></select>
        </div>
        <div class="group">
            <label>Stations</label>
            <div id="stations"></div>
        </div>
        <div id="timestamp">--:--</div>
        <button id="play-btn">▶ Play</button>
        <input type="range" id="time-slider" min="0" max="0" value="0">
        <a href="compare.html" class="nav-link">⇄ Compare Mode</a>
    </div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

12", "2025-11-13", "2025-11-14", "2025-11-15", "2025-11-16", "2025-11-17", "2025-11-18", "2025-11-19", "2025-11-20", "2025-11-21", "2025-11-22", "2025-11-23", "2025-11-24", "2025-11-25", "2025-11-26", "2025-11-27", "2025-11-28", "2025-11-29", "2025-11-30", "2025-12-01", "2025-12-02", "2025-12-03", "2025-12-04", "2025-12-05", "2025-12-06", "2025-12-07", "2025-12-08", "2025-12-09", "2025-12-10", "2025-12-11", "2025-12-12", "2025-12-13", "2025-12-14", "2025-12-15", "2025-12-16", "2025-12-17", "2025-12-18", "2025-12-19", "2025-12-20", "2025-12-21", "2025-12-22", "2025-12-23", "2025-12-24", "2025-12-25", "2025-12-26", "2025-12-27", "2025-12-28", "2025-12-29", "2025-12-30", "2025-12-31", "2026-01-01", "2026-01-02", "2026-01-03", "2026-01-04", "2026-01-05", "2026-01-06", "2026-01-07", "2026-01-08", "2026-01-09", "2026-01-10", "2026-01-11", "2026-01-12", "2026-01-13", "2026-01-14", "2026-01-15", "2026-01-16", "2026-01-17", "2026-01-18", "2026-01-19", "2026-01-20", "2026-01-21", "2026-01-22", "2026-01-23", "2026-01-24", "2026-01-25", "2026-01-26", "2026-01-27", "2026-01-28", "2026-01-29", "2026-01-30", "2026-01-31", "2026-02-01", "2026-02-02", "2026-02-03", "2026-02-04", "2026-02-05", "2026-02-06", "2026-02-07", "2026-02-08", "2026-02-09", "2026-02-10", "2026-02-11", "2026-02-12", "2026-02-13", "2026-02-14", "2026-02-15", "2026-02-16", "2026-02-17", "2026-02-18", "2026-02-19", "2026-02-20", "2026-02-21", "2026-02-22", "2026-02-23", "2026-02-24", "2026-02-25", "2026-02-26", "2026-02-27", "2026-02-28", "2026-03-01", "2026-03-02", "2026-03-03", "2026-03-04", "2026-03-05", "2026-03-06", "2026-03-07", "2026-03-08", "2026-03-09", "2026-03-10", "2026-03-11", "2026-03-12", "2026-03-13", "2026-03-14", "2026-03-15", "2026-03-16", "2026-03-17", "2026-03-18", "2026-03-19", "2026-03-20", "2026-03-21", "2026-03-22", "2026-03-23", "2026-03-24", "2026-03-25", "2026-03-26", "2026-03-27", "2026-03-28", "2026-03-29", "2026-03-30", "2026-03-31", "2026-04-01", "2026-04-02", "2026-04-03", "2026-04-04", "2026-04-05", "2026-04-06", "2026-04-07", "2026-04-08", "2026-04-09", "2026-04-10", "2026-04-11", "2026-04-12", "2026-04-13", "2026-04-14"], "STATION_MONTHS": {"BAL": ["202510", "202511", "202512", "202601", "202602", "202603", "202604"], "BTH": ["202510", "202511", "202512", "202601", "202602", "202603", "202604"], "DEN": ["202510", "202511", "202512", "202601", "202602", "202603", "202604"], "JAK": ["202510", "202511", "202512", "202601", "202602", "202603", "202604"], "MAK": ["202510", "202601", "202602", "202603", "202604"], "MED": ["202510", "202511", "202512", "202601", "202602", "202603", "202604"], "SBY": ["202510", "202511", "202512", "202601", "202602", "202603", "202604"], "SIN": ["202510", "202511", "202512", "202601", "202602", "202603", "202604"], "YOG": ["202510", "202511", "202512", "202601", "202602", "202603", "202604"]}, "INITIAL_CENTER": [-2.5, 118], "INITIAL_ZOOM": 5};
        let state = { map: null, overlays: new Map(), frames: [], index: 0, isPlaying: false, timer: null, activeStations: ['JAK', 'SBY', 'BAL', 'DEN'], cache: new Map(), bufferRadius: 15 };

        function init() {
            state.map = L.map('map').setView(CONFIG.INITIAL_CENTER, CONFIG.INITIAL_ZOOM);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© CARTO' }).addTo(state.map);
            initUI();
            const months = getUniqueMonths();
            if(months.length) {
                document.getElementById('month-select').value = months[0];
                populateDays(months[0]);
            }
        }

        function getUniqueMonths() {
            const m = new Set(CONFIG.AVAILABLE_DAYS.map(d => d.substring(0, 7))); 
            return Array.from(m).sort().reverse();
        }

        function initUI() {
            const monthSel = document.getElementById('month-select');
            getUniqueMonths().forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.text = new Date(m + '-01').toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
                monthSel.add(opt);
            });
            monthSel.onchange = (e) => populateDays(e.target.value);
            document.getElementById('day-select').onchange = (e) => loadDay(e.target.value);

            const stContainer = document.getElementById('stations');
            Object.keys(CONFIG.STATION_CONFIG).forEach(code => {
                const div = document.createElement('div');
                div.className = 'station-toggle';
                div.innerHTML = `<input type="checkbox" value="${code}" ${state.activeStations.includes(code) ? 'checked' : ''}> ${code}`;
                div.querySelector('input').onchange = (e) => {
                    if(e.target.checked) state.activeStations.push(code);
                    else state.activeStations = state.activeStations.filter(c => c !== code);
                    loadDay(document.getElementById('day-select').value); 
                };
                stContainer.appendChild(div);
            });

            document.getElementById('time-slider').oninput = (e) => showFrame(parseInt(e.target.value));
            document.getElementById('play-btn').onclick = togglePlay;
        }

        function populateDays(monthStr) {
            const daySel = document.getElementById('day-select');
            daySel.innerHTML = '';
            const days = CONFIG.AVAILABLE_DAYS.filter(d => d.startsWith(monthStr)).sort().reverse();
            days.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.text = d.split('-')[2];
                daySel.add(opt);
            });
            if(days.length) loadDay(days[0]);
        }

        async function loadDay(dateStr) {
            if(!dateStr) return;
            showLoading(true);
            const [y, m] = dateStr.split('-');
            const monthKey = y + m;
            const promises = state.activeStations.map(async code => {
                if(!CONFIG.STATION_MONTHS[code]?.includes(monthKey)) return [];
                try {
                    const res = await fetch(`data/${code}_${monthKey}.json`);
                    if(!res.ok) return [];
                    const data = await res.json();
                    return data.filter(item => item.time.startsWith(dateStr)).map(i => ({...i, s: code}));
                } catch (e) { return []; }
            });

            const results = await Promise.all(promises);
            const allFrames = results.flat();
            
            const timeMap = new Map();
            allFrames.forEach(f => {
                if(!timeMap.has(f.time)) timeMap.set(f.time, { time: f.time, stations: new Map() });
                timeMap.get(f.time).stations.set(f.s, f);
            });

            state.frames = Array.from(timeMap.values()).map(f => ({
                time: f.time,
                stations: Array.from(f.stations.values()) 
            })).sort((a,b) => a.time.localeCompare(b.time));

            state.cache.clear();
            
            if (state.frames.length === 0) {
                document.getElementById('timestamp').innerText = "No Data";
                state.overlays.forEach(l => state.map.removeLayer(l));
                state.overlays.clear();
                showLoading(false);
                return;
            }

            document.getElementById('time-slider').max = state.frames.length - 1;
            document.getElementById('time-slider').value = 0;
            showFrame(0);
            showLoading(false);
        }

        function showFrame(index) {
            state.index = index;
            const frame = state.frames[index];
            if(!frame) return;
            document.getElementById('timestamp').innerText = frame.time.replace('T', ' ').substring(0, 16);
            document.getElementById('time-slider').value = index;

            state.overlays.forEach(l => state.map.removeLayer(l));
            state.overlays.clear();

            frame.stations.forEach(st => {
                const cfg = CONFIG.STATION_CONFIG[st.s];
                const bounds = [[cfg.overlayBRC[0], cfg.overlayBRC[1]], [cfg.overlayTLC[0], cfg.overlayTLC[1]]];
                const overlay = L.imageOverlay(st.url, bounds, { opacity: 0.7 }).addTo(state.map); 
                state.overlays.set(st.s, overlay);
            });
            preload(index);
        }

        function preload(currIdx) {
            const end = Math.min(state.frames.length, currIdx + state.bufferRadius);
            for(let i=currIdx; i<end; i++) {
                state.frames[i].stations.forEach(st => {
                    if(!state.cache.has(st.url)) {
                        const img = new Image();
                        img.src = st.url;
                        state.cache.set(st.url, img);
                    }
                });
            }
        }

        function togglePlay() {
            state.isPlaying = !state.isPlaying;
            document.getElementById('play-btn').innerText = state.isPlaying ? '⏸ Pause' : '▶ Play';
            if(state.isPlaying) {
                state.timer = setInterval(() => {
                    let next = state.index + 1;
                    if(next >= state.frames.length) next = 0;
                    showFrame(next);
                }, 500);
            } else { clearInterval(state.timer); }
        }

        function showLoading(show) {
            document.getElementById('loading-fill').style.width = show ? '50%' : '100%';
            setTimeout(() => { if(!show) document.getElementById('loading-fill').style.width = '0%'; }, 200);
        }

        init();
    </script>
</body>
</html>
